# My herdr config, ~/.config/herdr/config.toml, as a link to this file. Use it whole, or merge
# the parts you want into yours, then run `herdr server reload-config`. The sidebar rows at the
# end are the part that shows herdr-agents' tokens.

# herdr's own first-run marker: a new machine skips the tour.
onboarding = false

[ui]
# New tabs open at once with herdr's generated number, no name prompt. Claude Code, Codex and pi
# tabs then take their session names from herdr-agents, after the agent's emoji (🦀 Claude Code,
# 🌀 Codex, 🥧 pi); rename others with the rename-tab key.
prompt_new_tab_name = false
# The outer terminal's title: the host, the workspace and the tab, which for a supported agent
# is its emoji and the session's name.
window_title = "{hostname}: {workspace} · {tab}"

# Colours over herdr's default theme: pure black backgrounds, so an OLED screen leaves those
# pixels off, with no bar behind the current space and the focused agent; their text is green
# instead (the sidebar rows below), and the active tab a green chip. Pane contents keep the outer
# terminal's own background: make that black too, e.g. Ghostty's `background = #000000`.
[theme.custom]
panel_bg = "#000000"       # tab bar, popups and menus
sidebar_bg = "#000000"     # the sidebar, by default the outer terminal's background
active_row_bg = "#000000"  # the current space and the focused agent, by default a grey bar
accent = "#00ff41"         # the active tab, and the chosen item in menus and settings

# Spaces: the current one's name green and bold. herdr has no colour of its own for it (its
# theme's text colour is every menu's text too), so herdr-agents reports each space's name as
# $space, the current one's as $space_focused instead; without herdr-agents' ticker a space shows
# its dot alone. The second row is herdr's own: the git branch and how far ahead or behind.
[ui.sidebar.spaces]
rows = [["state_icon", { token = "$space", fg = "#a6adc8" }, { token = "$space_focused", fg = "#00ff41", bold = true }], ["branch", "git_status"]]

# The agents sidebar, three rows for each agent pane.
#
# Each pane: the agent's emoji and its folder ($icon_place: 🦀 api, where herdr's own `workspace`
# names the folder its workspace was opened in), how long ago it last did something
# ($last_active: now, 7m, 5h, 3d) and the context its session holds ($context: 53k); then the
# session's name, which the agent writes into its terminal title; then the start of its last
# message to you ($last_message), on one line: what it is doing, or what it did, and its last
# shell command until it has written one. Codex's $session_title also removes its temporary
# "Action Required" prefix, pi's its "π - ", and a pi session with no name yet shows its tab's
# name if you gave one, else its first prompt. For the last shell command and
# its output's last line instead, the third row can be [{ token = "$last_cmd", dim = true },
# "$last_out"].
#
# Claude Code's sub-agents, while any run: how many at the end of the first row ($subagents:
# ◐ 2, yellow like herdr's working dot, since the session's own dot shows done or idle once its
# turn ends), then a row for each, up to three: ├ its task · what it is doing now. Rows with
# nothing in them are left out, so these are there only while sub-agents run.
#
# Light grey text (#c0c0c0), where herdr's is a darker grey hard to read on black, and not white,
# so the sidebar stays apart from the panes' text; green for the focused agent: herdr-agents
# reports its tokens as $<name>_focused instead ($title is the terminal title), so each token is
# there twice, light grey and green, and only one of the two has a value.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "machine", fg = "#c0c0c0" }, { token = "$icon_place", fg = "#c0c0c0" }, { token = "$icon_place_focused", fg = "#00ff41" }, { token = "$last_active", fg = "#c0c0c0" }, { token = "$last_active_focused", fg = "#00ff41" }, { token = "$context", fg = "#c0c0c0" }, { token = "$context_focused", fg = "#00ff41" }, { token = "$subagents", fg = "#f9e2af" }, { token = "$subagents_focused", fg = "#f9e2af" }],
  [{ token = "$title", fg = "#c0c0c0" }, { token = "$title_focused", fg = "#00ff41" }],
  [{ token = "$last_message", fg = "#c0c0c0" }, { token = "$last_message_focused", fg = "#00ff41" }],
  [{ token = "$subagent_1", fg = "#c0c0c0" }, { token = "$subagent_1_focused", fg = "#00ff41" }],
  [{ token = "$subagent_2", fg = "#c0c0c0" }, { token = "$subagent_2_focused", fg = "#00ff41" }],
  [{ token = "$subagent_3", fg = "#c0c0c0" }, { token = "$subagent_3_focused", fg = "#00ff41" }],
]
codex = [
  ["state_icon", { token = "machine", fg = "#c0c0c0" }, { token = "$icon_place", fg = "#c0c0c0" }, { token = "$icon_place_focused", fg = "#00ff41" }, { token = "$last_active", fg = "#c0c0c0" }, { token = "$last_active_focused", fg = "#00ff41" }, { token = "$context", fg = "#c0c0c0" }, { token = "$context_focused", fg = "#00ff41" }],
  [{ token = "$session_title", fg = "#c0c0c0" }, { token = "$session_title_focused", fg = "#00ff41" }],
  [{ token = "$last_message", fg = "#c0c0c0" }, { token = "$last_message_focused", fg = "#00ff41" }],
]
pi = [
  ["state_icon", { token = "machine", fg = "#c0c0c0" }, { token = "$icon_place", fg = "#c0c0c0" }, { token = "$icon_place_focused", fg = "#00ff41" }, { token = "$last_active", fg = "#c0c0c0" }, { token = "$last_active_focused", fg = "#00ff41" }, { token = "$context", fg = "#c0c0c0" }, { token = "$context_focused", fg = "#00ff41" }],
  [{ token = "$session_title", fg = "#c0c0c0" }, { token = "$session_title_focused", fg = "#00ff41" }],
  [{ token = "$last_message", fg = "#c0c0c0" }, { token = "$last_message_focused", fg = "#00ff41" }],
]
